<!DOCTYPE html>
<html lang="tg" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Админ Панел</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
body { background:#f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh; height:100dvh; overflow:hidden; }
.phone-container { width:100%; max-width:480px; height:100vh; height:100dvh; background:#fff; display:flex; flex-direction:column; position:relative; box-shadow:0 8px 30px rgba(0,0,0,.08); overflow:hidden; }

.admin-header { background:#007bff; color:#fff; padding:14px 16px; font-size:16px; font-weight:700; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; }
.admin-header-left { display:flex; align-items:center; gap:8px; }
.online-badge { width:8px; height:8px; background:#10b981; border-radius:50%; display:inline-block; }
.back-to-list { background:rgba(255,255,255,.2); color:#fff; border:none; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; display:none; }

.users-list-screen { flex:1; overflow-y:auto; background:#f8fafc; display:flex; flex-direction:column; }
.user-row { background:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #edf2f7; cursor:pointer; position:relative; }
.user-row:hover { background:#f1f5f9; }
.user-info { display:flex; flex-direction:column; gap:2px; flex:1; overflow:hidden; }
.user-name-wrapper { display:flex; align-items:center; gap:8px; }
.user-name { font-size:15px; font-weight:700; color:#1e293b; }
.unread-badge { background:#ef4444; color:#fff; font-size:11px; font-weight:bold; padding:2px 6px; border-radius:10px; display:none; }
.user-last-msg { font-size:13px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:250px; }
.menu-dots { padding:8px; font-size:18px; color:#94a3b8; cursor:pointer; font-weight:bold; border-radius:50%; width:34px; height:34px; display:flex; justify-content:center; align-items:center; flex-shrink:0; }
.menu-dots:hover { background:#e2e8f0; color:#475569; }
.context-menu { position:absolute; right:16px; top:45px; background:#fff; box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05); border-radius:12px; width:170px; z-index:200; display:none; border:1px solid #e2e8f0; overflow:hidden; }
.context-menu-item { padding:10px 14px; font-size:13px; font-weight:600; text-align:left; cursor:pointer; color:#334155; }
.context-menu-item:hover { background:#f1f5f9; }
.context-menu-item.delete-user { color:#ef4444; border-top:1px solid #f1f5f9; }

.chat-screen { flex:1; display:none; flex-direction:column; overflow:hidden; background:#e9edf3; }
#chatDisplay { flex:1; overflow-y:auto; padding:16px 16px 4px; display:flex; flex-direction:column; gap:4px; scrollbar-width:none; }
#chatDisplay::-webkit-scrollbar { display:none; }
.date-separator { align-self:center; background:rgba(0,0,0,.06); color:#5c6b7a; font-size:12px; font-weight:600; padding:4px 12px; border-radius:12px; margin:10px 0; }
.msg-row { display:flex; flex-direction:column; max-width:78%; margin-bottom:6px; }
.msg-row.mine { align-self:flex-end; align-items:flex-end; }
.msg-row.theirs { align-self:flex-start; align-items:flex-start; }
.msg { padding:7px 10px 6px; border-radius:14px; font-size:15px; line-height:20px; word-break:break-word; box-shadow:0 1px 2px rgba(0,0,0,.06); white-space:pre-wrap; }
.msg-row.mine .msg { background:#007bff; color:#fff; border-bottom-right-radius:4px; }
.msg-row.theirs .msg { background:#fff; color:#222; border:1px solid #e2e8f0; border-bottom-left-radius:4px; }
.msg a { color:inherit; text-decoration:underline; word-break:break-all; }
.reply-quote { border-left:3px solid rgba(255,255,255,.6); background:rgba(0,0,0,.08); padding:4px 8px; border-radius:6px; margin-bottom:5px; font-size:12.5px; opacity:.9; }
.msg-row.theirs .reply-quote { border-left-color:#007bff; background:rgba(0,123,255,.08); }
.reply-quote b { display:block; font-size:11.5px; }
.msg-meta { display:flex; align-items:center; gap:3px; font-size:10.5px; margin-top:3px; align-self:flex-end; opacity:.8; }
.msg-row.mine .msg-meta { color:rgba(255,255,255,.85); }
.msg-row.theirs .msg-meta { color:#8a94a0; }
.tick { font-size:12px; }
.tick.seen { color:#34b7f1 !important; }
.msg-actions { display:flex; gap:10px; margin-top:2px; padding:0 2px; }
.msg-actions button { background:none; border:none; font-size:12px; color:#8a94a0; cursor:pointer; opacity:.75; padding:2px; }
.reactions-row { display:flex; gap:3px; margin-top:3px; flex-wrap:wrap; }
.reaction-badge { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:1px 6px; font-size:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
.chat-image { max-width:220px; max-height:280px; border-radius:10px; cursor:pointer; display:block; margin:2px 0; }
.doc-msg { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; background:rgba(0,0,0,.04); padding:8px; border-radius:10px; min-width:170px; }
.msg-row.mine .doc-msg { background:rgba(255,255,255,.18); }
.doc-icon { font-size:26px; }
.doc-info { display:flex; flex-direction:column; overflow:hidden; }
.doc-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
.doc-size { font-size:11px; opacity:.7; }
.voice-msg { display:flex; align-items:center; gap:8px; min-width:190px; }
.voice-play-btn { width:32px; height:32px; border-radius:50%; border:none; background:#fff; color:#007bff; font-size:14px; cursor:pointer; flex-shrink:0; }
.msg-row.theirs .voice-play-btn { background:#007bff; color:#fff; }
.voice-progress { flex:1; accent-color:#fff; height:4px; }
.msg-row.theirs .voice-progress { accent-color:#007bff; }
.voice-time { font-size:10.5px; white-space:nowrap; }
.voice-speed-btn { border:none; background:rgba(255,255,255,.3); color:inherit; border-radius:8px; font-size:10.5px; padding:2px 5px; cursor:pointer; flex-shrink:0; }
.msg-row.theirs .voice-speed-btn { background:rgba(0,123,255,.12); }

.reply-preview { display:none; align-items:center; justify-content:space-between; background:#eef4ff; padding:8px 14px; border-top:1px solid #dbe6f5; }
.reply-preview-text { font-size:13px; color:#334155; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:85%; }
.reply-preview button { background:none; border:none; font-size:16px; color:#64748b; cursor:pointer; }

.input-zone { padding:10px 12px 16px; background:#f4f6f9; display:flex; gap:8px; align-items:flex-end; flex-shrink:0; }
textarea { flex:1; padding:11px 14px; border:1px solid #e2e8f0; border-radius:20px; font-size:15px; background:#fff; outline:none; resize:none; min-height:42px; max-height:110px; line-height:20px; overflow-y:auto; }
.round-btn { width:42px; height:42px; border-radius:50%; border:none; background:#007bff; color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.round-btn:active { background:#0056b3; }
.round-btn.recording { background:#ef4444; animation:pulseGlow 1s infinite; }
@keyframes pulseGlow { 0%{transform:scale(.9);opacity:.6;} 50%{transform:scale(1.1);opacity:1;} 100%{transform:scale(.9);opacity:.6;} }
.attach-btn { background:#e9edf3; color:#007bff; }
#fileInput { display:none; }

.lightbox-overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; align-items:center; justify-content:center; z-index:99999; flex-direction:column; }
.lightbox-overlay.show { display:flex; }
.lightbox-overlay img { max-width:92%; max-height:75%; border-radius:6px; }
.lightbox-bar { display:flex; gap:20px; margin-top:16px; }
.lightbox-bar a, .lightbox-bar button { background:rgba(255,255,255,.15); color:#fff; border:none; padding:10px 18px; border-radius:20px; font-size:14px; text-decoration:none; cursor:pointer; }

.reaction-picker { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#fff; border-radius:30px; padding:8px 12px; display:none; gap:8px; box-shadow:0 6px 20px rgba(0,0,0,.2); z-index:9999; }
.reaction-picker.show { display:flex; }
.reaction-picker span { font-size:22px; cursor:pointer; }
</style>
</head>
<body>
<div class="phone-container">
  <div class="admin-header">
    <div class="admin-header-left"><span class="online-badge"></span><span id="adminPanelTitle">Админ Панел</span></div>
    <button id="backBtn" class="back-to-list" onclick="closeChat()">← Рӯйхат</button>
  </div>

  <div id="usersListScreen" class="users-list-screen"></div>

  <div id="chatScreen" class="chat-screen">
    <div id="chatDisplay"></div>
    <div class="reply-preview" id="replyPreview">
      <div class="reply-preview-text" id="replyPreviewText"></div>
      <button onclick="cancelReply()">✕</button>
    </div>
    <div class="input-zone">
      <button class="round-btn attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
      <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip,.rar,.ppt,.pptx">
      <textarea id="adminMsg" placeholder="Ҷавоб ба корбар..." rows="1" oninput="onMsgInput(this)"></textarea>
      <button class="round-btn" id="actionBtn">🎤</button>
    </div>
  </div>

  <div class="lightbox-overlay" id="lightboxOverlay">
    <img id="lightboxImg" src="">
    <div class="lightbox-bar">
      <a id="lightboxDownload" href="#" download="image.jpg">⬇ Скачат</a>
      <button onclick="document.getElementById('lightboxOverlay').classList.remove('show')">✕ Пӯшидан</button>
    </div>
  </div>

  <div class="reaction-picker" id="reactionPicker">
    <span onclick="selectReaction('👍')">👍</span>
    <span onclick="selectReaction('❤️')">❤️</span>
    <span onclick="selectReaction('😂')">😂</span>
    <span onclick="selectReaction('😮')">😮</span>
    <span onclick="selectReaction('😢')">😢</span>
    <span onclick="selectReaction('🙏')">🙏</span>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
import { getDatabase, ref, push, set, onValue, onDisconnect, remove, update, get } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyDskehF5n_IJuuUsGWQEFBmjM80uCSDEyM",
  authDomain:"live-chat-ea070.firebaseapp.com",
  databaseURL:"https://live-chat-ea070-default-rtdb.firebaseio.com",
  projectId:"live-chat-ea070",
  storageBucket:"live-chat-ea070.firebasestorage.app",
  messagingSenderId:"321161064947",
  appId:"1:321161064947:web:53603c0e1be0b3baf66286"
};
const db = getDatabase(initializeApp(firebaseConfig));
const adminStatusRef = ref(db, 'admin_status/');
set(adminStatusRef, { status:"online", current_chat:"" });
onDisconnect(adminStatusRef).set({ status:"offline", current_chat:"" });

let selectedUser = "";
let allMessages = {};
let replyingTo = null;
let activeReactionId = null;
let currentPlayingAudio = null;
let prevUnread = {};
let usersInitDone = false;

/* ---------- Овозҳо ---------- */
let audioCtx;
function ctx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function tone(f1,f2,dur,type,g){ try{ const c=ctx(); const o=c.createOscillator(); const gn=c.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f1,c.currentTime); if(f2) o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+dur); gn.gain.setValueAtTime(g||.05,c.currentTime); gn.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur); o.connect(gn).connect(c.destination); o.start(); o.stop(c.currentTime+dur); }catch(e){} }
window.playClick = ()=>tone(880,640,.07,'triangle',.04);
window.playSend = ()=>tone(500,900,.12,'sine',.05);
window.playReceive = ()=>tone(700,500,.15,'sine',.05);
document.addEventListener('click', e=>{ if(e.target.closest('button,.doc-msg,.chat-image,.user-row')) window.playClick(); });

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function linkify(text){ return escapeHtml(text).replace(/((https?:\/\/|www\.)[^\s<]+)/g, m=>{ let u=m.startsWith('http')?m:'https://'+m; return `<a href="${u}" target="_blank" rel="noopener">${m}</a>`; }); }
function formatTime(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function formatDur(sec){ sec=Math.max(0,Math.floor(sec||0)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

/* ---------- Рӯйхати корбарон ---------- */
onValue(ref(db, 'sayt1_active_users/'), snap=>{
  const el = document.getElementById('usersListScreen');
  el.innerHTML=''; const data = snap.val();
  if(!data){ el.innerHTML='<div style="padding:20px;text-align:center;color:#94a3b8;">Ҳеҷ корбаре нест</div>'; usersInitDone=true; return; }

  for(let username in data){
    const u = data[username];
    const lastMsg = u.lastMessage || "Паёме нест...";
    const unread = u.unreadCount || 0;
    if(usersInitDone && (prevUnread[username]||0) < unread) window.playReceive();
    prevUnread[username] = unread;

    const row = document.createElement('div'); row.className='user-row'; row.onclick=()=>openChat(username);
    row.innerHTML = `
      <div class="user-info">
        <div class="user-name-wrapper"><span class="user-name">${escapeHtml(username)}</span><span class="unread-badge" style="display:${unread>0?'inline-block':'none'}">${unread}</span></div>
        <span class="user-last-msg">${escapeHtml(lastMsg)}</span>
      </div>
      <div class="menu-dots" onclick="toggleMenu(event,'${username}')">⋮</div>
      <div id="menu-${username}" class="context-menu">
        <div class="context-menu-item delete-user" onclick="deleteUser(event,'${username}')">Нест кардани корбар</div>
      </div>`;
    el.appendChild(row);
  }
  usersInitDone = true;
});

window.openChat = (username)=>{
  selectedUser = username;
  update(ref(db,'admin_status/'), { current_chat:username });
  update(ref(db, `sayt1_active_users/${username}`), { unreadCount:0 });
  window.parent.postMessage({ type:"chat-conversation-open" }, "*");
  document.getElementById('usersListScreen').style.display='none';
  document.getElementById('chatScreen').style.display='flex';
  document.getElementById('backBtn').style.display='block';
  document.getElementById('adminPanelTitle').innerText = `Чат: ${username}`;
  loadMessages(username);
  setTimeout(()=>document.getElementById('adminMsg').focus(),100);
};
window.closeChat = ()=>{
  selectedUser="";
  update(ref(db,'admin_status/'), { current_chat:"" });
  window.parent.postMessage({ type:"chat-conversation-closed" }, "*");
  document.getElementById('usersListScreen').style.display='flex';
  document.getElementById('chatScreen').style.display='none';
  document.getElementById('backBtn').style.display='none';
  document.getElementById('adminPanelTitle').innerText = "Админ Панел";
};

/* ---------- Матн вуруд/ирсол ---------- */
window.onMsgInput = (ta)=>{
  ta.style.height='42px'; ta.style.height=(ta.scrollHeight<110?ta.scrollHeight:110)+'px';
  document.getElementById('actionBtn').innerHTML = ta.value.trim()==='' ? '🎤' : '➤';
};
document.getElementById('adminMsg').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); trySend(); } });
function trySend(){ const ta=document.getElementById('adminMsg'); if(ta.value.trim()!=='') sendAdmin(); }

async function pushMsg(data){
  if(!selectedUser) return;
  const msgRef = push(ref(db, `sayt1_chats/${selectedUser}`));
  await set(msgRef, Object.assign({ user:"Админ", timestamp:Date.now() }, data));
  window.playSend(); window.cancelReply();
}

window.sendAdmin = async ()=>{
  const inputEl = document.getElementById('adminMsg');
  const text = inputEl.value.trim();
  if(text===""||!selectedUser) return;
  const data = { text, type:'text' };
  if(replyingTo) data.replyTo = replyingTo;
  await pushMsg(data);
  inputEl.value=''; inputEl.style.height='42px'; window.onMsgInput(inputEl);
};

/* ---------- Файл/расм ---------- */
document.getElementById('fileInput').addEventListener('change', async e=>{
  const file = e.target.files[0]; if(!file || !selectedUser) return;
  if(file.type.startsWith('audio/') || file.type.startsWith('video/')){ alert('Ирсоли мусиқӣ ва видео иҷозат дода намешавад'); e.target.value=''; return; }
  try{
    if(file.type.startsWith('image/')){
      const dataUrl = await compressImage(file);
      const data = { type:'image', fileData:dataUrl, fileName:file.name, fileSize:Math.round(dataUrl.length*3/4) };
      if(replyingTo) data.replyTo = replyingTo;
      await pushMsg(data);
    } else {
      if(file.size>5*1024*1024){ alert('Файл хеле калон аст (макс 5MB)'); e.target.value=''; return; }
      const dataUrl = await readAsDataURL(file);
      const data = { type:'document', fileData:dataUrl, fileName:file.name, fileSize:file.size };
      if(replyingTo) data.replyTo = replyingTo;
      await pushMsg(data);
    }
  }catch(err){ alert('Хатогӣ ҳангоми ирсоли файл'); }
  e.target.value='';
});

function compressImage(file, maxBytes=60*1024){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height; const maxDim=1280;
        if(w>maxDim||h>maxDim){ if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        const cx = canvas.getContext('2d'); cx.drawImage(img,0,0,w,h);
        let quality=0.8, dataUrl=canvas.toDataURL('image/jpeg',quality);
        const sizeOf = du=>Math.round(du.length*3/4);
        let tries=0;
        while(sizeOf(dataUrl)>maxBytes && quality>0.12 && tries<12){ quality-=0.08; dataUrl=canvas.toDataURL('image/jpeg',quality); tries++; }
        tries=0;
        while(sizeOf(dataUrl)>maxBytes && tries<6){ w=Math.round(w*0.85); h=Math.round(h*0.85); canvas.width=w; canvas.height=h; cx.drawImage(img,0,0,w,h); dataUrl=canvas.toDataURL('image/jpeg',quality); tries++; }
        resolve(dataUrl);
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}

/* ---------- Овоз ---------- */
let mediaRecorder, audioChunks=[], recording=false, recordStart=0;
const actionBtn = document.getElementById('actionBtn');
function startRec(e){
  if(document.getElementById('adminMsg').value.trim()!=='' || !selectedUser) return;
  e.preventDefault();
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    mediaRecorder = new MediaRecorder(stream); audioChunks=[]; recording=true; recordStart=Date.now();
    actionBtn.classList.add('recording');
    mediaRecorder.ondataavailable = ev=>audioChunks.push(ev.data);
    mediaRecorder.onstop = async ()=>{
      actionBtn.classList.remove('recording');
      const dur = Math.round((Date.now()-recordStart)/1000);
      stream.getTracks().forEach(t=>t.stop());
      if(dur<1 || audioChunks.length===0) return;
      const blob = new Blob(audioChunks,{type:'audio/webm'});
      const dataUrl = await readAsDataURL(blob);
      const data = { type:'voice', fileData:dataUrl, fileSize:blob.size, duration:dur };
      if(replyingTo) data.replyTo = replyingTo;
      await pushMsg(data);
    };
    mediaRecorder.start();
  }).catch(()=>alert('Дастрасӣ ба микрофон рад шуд'));
}
function stopRec(){ if(recording && mediaRecorder && mediaRecorder.state!=='inactive'){ mediaRecorder.stop(); recording=false; } }
actionBtn.addEventListener('mousedown', e=>{ if(actionBtn.innerHTML.trim()==='➤'){ trySend(); } else startRec(e); });
actionBtn.addEventListener('touchstart', e=>{ if(actionBtn.innerHTML.trim()!=='➤'){ startRec(e); } });
actionBtn.addEventListener('mouseup', stopRec);
actionBtn.addEventListener('mouseleave', stopRec);
actionBtn.addEventListener('touchend', stopRec);
actionBtn.addEventListener('click', e=>{ if(actionBtn.innerHTML.trim()==='➤') trySend(); });

/* ---------- Плеери овоз ---------- */
window.toggleVoicePlay = (id, btn)=>{
  const audio = document.getElementById('audio-'+id); if(!audio) return;
  if(currentPlayingAudio && currentPlayingAudio!==audio){ currentPlayingAudio.pause(); document.querySelectorAll('.voice-play-btn').forEach(b=>b.textContent='▶'); }
  if(audio.paused){ audio.play(); currentPlayingAudio=audio; btn.textContent='⏸'; } else { audio.pause(); btn.textContent='▶'; }
  audio.ontimeupdate = ()=>{ const p=document.querySelector(`.voice-progress[data-id="${id}"]`); if(p && audio.duration) p.value=(audio.currentTime/audio.duration)*100; const t=document.getElementById('voice-time-'+id); if(t) t.textContent = formatDur(audio.currentTime)+' / '+formatDur(audio.duration); };
  audio.onended = ()=>{ btn.textContent='▶'; };
};
window.cycleSpeed = (id, btn)=>{ const audio=document.getElementById('audio-'+id); const speeds=[1,1.5,2]; let i=speeds.indexOf(audio.playbackRate); if(i<0)i=0; i=(i+1)%speeds.length; audio.playbackRate=speeds[i]; btn.textContent=speeds[i]+'x'; };
document.getElementById('chatDisplay').addEventListener('input', e=>{ if(e.target.classList.contains('voice-progress')){ const id=e.target.dataset.id; const audio=document.getElementById('audio-'+id); if(audio && audio.duration) audio.currentTime=(e.target.value/100)*audio.duration; } });

/* ---------- Lightbox ---------- */
window.openLightbox = (id)=>{
  const m = allMessages[id]; if(!m) return;
  document.getElementById('lightboxImg').src = m.fileData;
  document.getElementById('lightboxDownload').href = m.fileData;
  document.getElementById('lightboxDownload').download = m.fileName || 'image.jpg';
  document.getElementById('lightboxOverlay').classList.add('show');
};
document.getElementById('lightboxOverlay').addEventListener('click', e=>{ if(e.target.id==='lightboxOverlay') e.target.classList.remove('show'); });

/* ---------- Ҷавоб/реаксия ---------- */
window.setReply = (id)=>{
  const m = allMessages[id]; if(!m) return;
  const who = m.user==="Админ" ? 'Шумо' : m.user;
  const preview = m.text || (m.type==='image'?'📷 Расм':m.type==='document'?'📄 '+(m.fileName||'Файл'):m.type==='voice'?'🎤 Овоз':'');
  replyingTo = { key:id, user:m.user, text:preview.slice(0,80) };
  document.getElementById('replyPreview').style.display='flex';
  document.getElementById('replyPreviewText').textContent = who+': '+preview.slice(0,60);
  document.getElementById('adminMsg').focus();
};
window.cancelReply = ()=>{ replyingTo=null; document.getElementById('replyPreview').style.display='none'; };
window.openReactionPicker = (id)=>{ activeReactionId=id; document.getElementById('reactionPicker').classList.add('show'); };
window.selectReaction = (emoji)=>{
  if(!activeReactionId || !selectedUser) return;
  set(ref(db, `sayt1_chats/${selectedUser}/${activeReactionId}/reactions/Админ`), emoji);
  document.getElementById('reactionPicker').classList.remove('show'); activeReactionId=null;
};
document.addEventListener('click', e=>{ if(!e.target.closest('.reaction-picker') && !e.target.closest('.msg-actions')) document.getElementById('reactionPicker').classList.remove('show'); });

/* ---------- Менюи корбар (танҳо нест кардан) ---------- */
window.toggleMenu = (event, username)=>{
  event.stopPropagation();
  document.querySelectorAll('.context-menu').forEach(m=>{ if(m.id!==`menu-${username}`) m.style.display='none'; });
  const menu = document.getElementById(`menu-${username}`);
  menu.style.display = menu.style.display==='block' ? 'none' : 'block';
};
window.deleteUser = (event, username)=>{
  event.stopPropagation();
  if(confirm(`Корбар ${username}-ро комилан нест мекунед?`)){
    remove(ref(db, `sayt1_chats/${username}`));
    remove(ref(db, `sayt1_active_users/${username}`));
    if(selectedUser===username) closeChat();
  }
  document.getElementById(`menu-${username}`).style.display='none';
};
document.addEventListener('click', ()=>document.querySelectorAll('.context-menu').forEach(m=>m.style.display='none'));

/* ---------- Рендери паёмҳо ---------- */
function renderReactions(reactions){
  if(!reactions) return '';
  const counts={}; Object.values(reactions).forEach(e=>counts[e]=(counts[e]||0)+1);
  return `<div class="reactions-row">${Object.entries(counts).map(([e,c])=>`<span class="reaction-badge">${e} ${c>1?c:''}</span>`).join('')}</div>`;
}
function renderMsg(msg, id){
  const isMine = msg.user === "Админ";
  let content='';
  if(msg.type==='image'){ content = `<img class="chat-image" src="${msg.fileData}" onclick="openLightbox('${id}')">`; }
  else if(msg.type==='document'){ const kb=Math.round((msg.fileSize||0)/1024); content = `<a class="doc-msg" href="${msg.fileData}" download="${escapeHtml(msg.fileName||'file')}"><span class="doc-icon">📄</span><span class="doc-info"><span class="doc-name">${escapeHtml(msg.fileName||'Файл')}</span><span class="doc-size">${kb} KB</span></span></a>`; }
  else if(msg.type==='voice'){ content = `<div class="voice-msg"><button class="voice-play-btn" onclick="toggleVoicePlay('${id}', this)">▶</button><input type="range" class="voice-progress" min="0" max="100" value="0" data-id="${id}"><span class="voice-time" id="voice-time-${id}">${formatDur(msg.duration)}</span><button class="voice-speed-btn" onclick="cycleSpeed('${id}', this)">1x</button><audio id="audio-${id}" src="${msg.fileData}" preload="none"></audio></div>`; }
  else { content = linkify(msg.text||''); }

  const replyHtml = msg.replyTo ? `<div class="reply-quote"><b>${escapeHtml(msg.replyTo.user)}</b>${escapeHtml(msg.replyTo.text)}</div>` : '';
  const ticks = isMine ? `<span class="tick ${msg.seenByUser?'seen':''}">✓✓</span>` : '';

  return `<div class="msg-row ${isMine?'mine':'theirs'}">
    <div class="msg">${replyHtml}${content}<div class="msg-meta"><span>${formatTime(msg.timestamp||Date.now())}</span>${ticks}</div></div>
    ${renderReactions(msg.reactions)}
    <div class="msg-actions"><button onclick="setReply('${id}')">↩ Ҷавоб</button><button onclick="openReactionPicker('${id}')">🙂 Реаксия</button></div>
  </div>`;
}

function loadMessages(username){
  onValue(ref(db, `sayt1_chats/${username}`), snap=>{
    if(selectedUser!==username) return;
    const display = document.getElementById('chatDisplay');
    const data = snap.val() || {};
    allMessages = data;
    display.innerHTML='';
    let lastDate='';
    Object.keys(data).forEach(key=>{
      const msg = data[key];
      if(msg.timestamp){
        const dStr = new Date(msg.timestamp).toDateString();
        if(dStr!==lastDate){ display.innerHTML += `<div class="date-separator">${new Date(msg.timestamp).toLocaleDateString('tg-TJ',{day:'numeric',month:'long',year:'numeric'})}</div>`; lastDate=dStr; }
      }
      display.innerHTML += renderMsg(msg, key);
      if(msg.user!=="Админ" && !msg.seenByAdmin) update(ref(db, `sayt1_chats/${username}/${key}`), { seenByAdmin:true });
    });
    display.scrollTop = display.scrollHeight;
  });
}
</script>
</body>
</html>
