<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дизайни ниҳоӣ бо меню</title>

    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            user-select: none; font-family: sans-serif;
            background-color: #f9f9f9;
            display: flex; flex-direction: column;
            transition: background-color 0.3s;
        }

        * { -webkit-tap-highlight-color: transparent !important; }

        header { 
            background: #34495e; color: white; padding: 15px; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom-left-radius: 25px; border-bottom-right-radius: 25px;
        }

        .header-left, .header-right { display: flex; align-items: center; gap: 15px; }

        .btn-round { 
            cursor: pointer; width: 45px; height: 45px;
            background-color: #006699;
            border: 2px solid white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-round:active { transform: scale(0.85); opacity: 0.7; }

        .side-menu {
            position: fixed; left: -300px; top: 0;
            width: 250px; height: 100%;
            background: #34495e; color: white;
            transition: 0.4s; z-index: 100;
            padding: 10px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            overflow-y: auto;
        }
        .side-menu.active { left: 0; }

        .settings-frame {
            border: 2px solid #5d6d7e;
            padding: 8px;
            border-radius: 15px;
            margin-bottom: 8px;
        }
        .frame-title { 
            margin-bottom: 5px; font-size: 13px; color: #bdc3c7; text-align: center; 
        }

        .social-btn {
            display: flex; align-items: center;
            width: 100%; height: 45px;
            color: white;
            border-radius: 20px;
            padding: 0 10px; cursor: pointer;
            text-decoration: none; font-weight: bold;
            margin-bottom: 5px;
            transition: transform 0.2s, opacity 0.2s;
            box-sizing: border-box;
        }
        .social-btn:active { transform: scale(0.95); opacity: 0.8; }

        .whatsapp-btn { background: #25D366; }
        .telegram-btn { background: #0088cc; }
        .new-btn { background: #ff4500; } 
        .chat-btn { background: #8e44ad; }
        .group-btn { background: #3498db; }

        .icon-container {
            width: 35px; height: 35px;
            background: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
            overflow: hidden;
            padding: 0;
        }
        .icon-container img {
            width: 100%; height: 100%; 
            object-fit: cover;
        }
        
        .icon-max { width: 100% !important; height: 100% !important; }

        .inline-container {
            display: flex; justify-content: space-around; gap: 5px;
        }
        
        .icon-only-btn {
            width: 55px; height: 55px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
            background: white;
            overflow: hidden;
            padding: 0;
        }
        .icon-only-btn img { 
            width: 100%; height: 100%; 
            object-fit: cover;
        }
        .icon-only-btn:active { transform: scale(0.9); }

        .main-content { 
            position: relative; margin: 30px auto; margin-left: 60px;
            width: 80%; max-width: 600px; height: 160px;
            background: white; box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border: 6px solid #34495e; border-left: none;
            border-radius: 80px 30px 30px 80px;
            overflow: hidden; 
            flex-shrink: 0;
        }

        .overlay-panel {
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%;
            background: rgba(52, 73, 94, 0.9);
            color: white;
            display: flex; align-items: center; justify-content: center;
            transition: 0.5s ease;
            z-index: 5;
            border-radius: 80px 30px 30px 80px;
        }
        .overlay-panel.active { right: 0; }

        .circle-button {
            position: fixed; left: 20px; top: 200px;
            width: 70px; height: 70px;
            background-color: #006699; border-radius: 50%;
            border: 5px solid #f9f9f9; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; padding: 0;
        }
        .circle-button:active { transform: scale(0.85); opacity: 0.8; }
        
        #menuIcon { 
            width: 50%; height: 50%; filter: invert(1); 
            transition: transform 0.4s ease; 
        }

        .rotate { transform: rotate(180deg); }

        footer { 
            margin-top: auto; 
            background: #2c3e50; color: white; text-align: center; 
            padding: 15px; font-size: 14px;
            border-top-left-radius: 25px; border-top-right-radius: 20px;
        }
    </style>
</head>
<body> 

    <div class="side-menu" id="sideMenu">
        <div class="settings-frame" style="margin-top: 5px;">
            <h2 style="margin: 0; text-align: center; font-size: 18px; color: white;">Меню</h2>
        </div>
        
        <div class="settings-frame">
            <div class="frame-title">Дар тамос шудан</div>
            <a href="#" class="social-btn whatsapp-btn"><div class="icon-container"><img src="https://cdn-icons-png.flaticon.com/128/4494/4494494.png"></div>WhatsApp</a>
            <a href="#" class="social-btn telegram-btn"><div class="icon-container"><img src="https://cdn-icons-png.flaticon.com/128/906/906377.png"></div>Telegram</a>
            <a href="#" class="social-btn new-btn"><div class="icon-container"><img class="icon-max" src="https://avatars.mds.yandex.net/i?id=7b0a0fe6f7d32f6e72147704b99abc0f8ffb3860-5647582-images-thumbs&n=13"></div>Max</a>
        </div>

<div class="settings-frame">
    <div class="frame-title">Чат бо админ</div>
    <!-- Атрибути href-ро ба суроғаи лозима иваз кардем -->
    <a href="https://kholidtj1995.github.io/sayt-1/chat.html" class="social-btn chat-btn">
        <div class="icon-container">
            <img src="https://cdn-icons-png.flaticon.com/128/10308/10308218.png">
        </div>
        Суҳбат кардан
    </a>
</div>

        <div class="settings-frame">
            <div class="frame-title">Групаи махсус</div>
            <a href="#" class="social-btn group-btn">
                <div class="icon-container"><img src="https://images.icon-icons.com/407/PNG/96/Group_40731.png"></div>
                Хабарҳои нав
            </a>
        </div>

        <div class="settings-frame">
            <div class="frame-title">Гуруҳои иловаги</div>
            <div class="inline-container">
                <a href="#" class="icon-only-btn"><img src="https://cdn-icons-png.flaticon.com/128/4494/4494494.png"></a>
                <a href="#" class="icon-only-btn"><img src="https://cdn-icons-png.flaticon.com/128/906/906377.png"></a>
                <a href="#" class="icon-only-btn"><img class="icon-max" src="https://avatars.mds.yandex.net/i?id=7b0a0fe6f7d32f6e72147704b99abc0f8ffb3860-5647582-images-thumbs&n=13"></a>
            </div>
        </div>

        <div class="settings-frame">
            <div class="frame-title">Каналҳо</div>
            <div class="inline-container">
                <a href="#" class="icon-only-btn"><img src="https://cdn-icons-png.flaticon.com/128/3670/3670147.png"></a>
                <a href="#" class="icon-only-btn"><img src="https://cdn-icons-png.flaticon.com/128/3955/3955024.png"></a>
                <a href="#" class="icon-only-btn"><img src="https://cdn-icons-png.flaticon.com/128/15789/15789316.png"></a>
            </div>
        </div>
    </div>

    <header>
        <div class="header-left">
            <div class="btn-round" onclick="toggleMenu()">
                <img src="https://cdn-icons-png.flaticon.com/128/6059/6059003.png" alt="Menu" style="width: 25px; filter: invert(1);">
            </div>
        </div>
        <h1 style="font-size: 18px; margin: 0;">Вебсайти шумо</h1>
        <div class="header-right">
            <div class="btn-round" onclick="toggleTheme()" id="themeIcon" style="color: white;">🌙</div>
        </div>
    </header>

    <div class="main-content">
        <div class="overlay-panel" id="overlayPanel">
            <h3>Равзанаи нав</h3>
        </div>
        <img src="https://i.pinimg.com/originals/04/44/68/044468b7dce64f977587379372701655.jpg" alt="Расм" style="width:100%; height:100%; object-fit:cover; border-radius: 80px 30px 30px 80px;">
    </div>
    
    <button class="circle-button" onclick="toggleMainIcon()">
        <img id="menuIcon" src="https://cdn-icons-png.flaticon.com/128/4211/4211344.png" alt="Toggle">
    </button>

    <footer><p>&copy; 2026 Ҳамаи ҳуқуқҳо ҳифз шудаанд.</p></footer>

    <script>
        function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); }
        
        function toggleMainIcon() {
            const icon = document.getElementById('menuIcon');
            const panel = document.getElementById('overlayPanel');
            const icon1 = 'https://cdn-icons-png.flaticon.com/128/4211/4211344.png';
            const icon2 = 'https://cdn-icons-png.flaticon.com/128/714/714456.png';
            
            icon.src = icon.src.includes('4211344') ? icon2 : icon1;
            icon.classList.toggle('rotate');
            panel.classList.toggle('active');
        }

        document.body.addEventListener('click', function(e) {
            const menu = document.getElementById('sideMenu');
            const menuBtn = document.querySelector('.btn-round');
            if (!menu.contains(e.target) && !menuBtn.contains(e.target)) { menu.classList.remove('active'); }
        });

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            body.style.backgroundColor = body.style.backgroundColor === 'rgb(26, 26, 26)' ? '#f9f9f9' : '#1a1a1a';
            icon.innerHTML = icon.innerHTML === '🌙' ? '☀️' : '🌙';
        }
    </script>
</body>
</html>
