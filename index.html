    <style>
        :root {
            --bg1: #f4ede1;
            --bg2: #fbe3c9;
            --surface: rgba(255,255,255,0.55);
            --surface-border: rgba(255,255,255,0.8);
            --text: #2c2410;
            --muted: #8a7857;
            --accent: #d97706;
            --accent2: #ffb347;
            --glow: rgba(217,119,6,0.35);
            --card-shadow: 0 8px 30px rgba(120,80,20,0.18);
        }
        body.dark-mode {
            --bg1: #05070d;
            --bg2: #10182b;
            --surface: rgba(255,255,255,0.06);
            --surface-border: rgba(255,183,71,0.25);
            --text: #f2ead9;
            --muted: #b9a98a;
            --accent: #ffb347;
            --accent2: #ff7a30;
            --glow: rgba(255,179,71,0.35);
            --card-shadow: 0 8px 30px rgba(0,0,0,0.55);
        }

        html, body {
            margin: 0; padding: 0; height: 100%;
            user-select: none; font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 15% 0%, var(--bg2), transparent 55%),
                        linear-gradient(160deg, var(--bg1), var(--bg2));
            color: var(--text);
            display: flex; flex-direction: column;
            transition: background-color 0.4s, color 0.4s;
        }

        * { -webkit-tap-highlight-color: transparent !important; }

        header { 
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white; padding: 15px; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom-left-radius: 25px; border-bottom-right-radius: 25px;
            border: 3px solid rgba(0,0,0,0.25); border-top: none;
            box-shadow: 0 6px 24px var(--glow);
            position: relative; z-index: 200;
            transition: background 0.4s, box-shadow 0.4s;
        }

        .header-left, .header-right { display: flex; align-items: center; gap: 15px; }

        .site-title-frame {
            display: inline-block;
            padding: 6px 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.05));
            border: 1.5px solid rgba(255,255,255,0.55);
            box-shadow: 0 0 10px rgba(255,255,255,0.25), inset 0 0 8px rgba(255,255,255,0.15);
            animation: title-breathe 3s ease-in-out infinite;
        }
        @keyframes title-breathe {
            0%, 100% {
                box-shadow: 0 0 8px rgba(255,255,255,0.2), inset 0 0 6px rgba(255,255,255,0.1);
                border-color: rgba(255,255,255,0.4);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 20px rgba(255,255,255,0.6), inset 0 0 12px rgba(255,255,255,0.25);
                border-color: rgba(255,255,255,0.95);
                transform: scale(1.03);
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .site-title-frame { animation: none; }
        }

        .btn-round { 
            cursor: pointer; width: 45px; height: 45px;
            background: linear-gradient(135deg, #0a3a52, #006699);
            border: 2px solid rgba(255,255,255,0.7); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.35);
            transition: transform 0.15s, opacity 0.15s, box-shadow 0.2s;
        }
        .btn-round:active { transform: scale(0.82); opacity: 0.75; box-shadow: 0 0 18px var(--glow); }

        .side-menu {
            position: fixed; left: 0; top: 0; bottom: 0;
            width: 250px; box-sizing: border-box;
            background: var(--surface);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            color: var(--text);
            transform: translateX(-110%);
            transition: transform 0.35s ease, background-color 0.4s, color 0.4s;
            will-change: transform;
            z-index: 90;
            display: flex; flex-direction: column;
            padding: 0 10px;
            padding-top: var(--header-h, 70px);
            padding-bottom: var(--footer-h, 55px);
            border-right: 1px solid var(--surface-border);
            box-shadow: 4px 0 30px rgba(0,0,0,0.25);
            overflow-y: auto; overflow-x: hidden;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }
        .side-menu.active { transform: translateX(0); }

        .settings-frame {
            border: 1px solid var(--surface-border);
            background: rgba(255,255,255,0.04);
            padding: 6px;
            border-radius: 15px;
            margin-bottom: 8px;
            box-shadow: var(--card-shadow);
            transition: border-color 0.3s, background-color 0.3s;
        }
        /* Ислоҳи нав барои скроли уфуқӣ */
        .scroll-wrapper {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 10px;
            padding-bottom: 5px;
            scrollbar-width: none; /* Firefox */
        }
        .scroll-wrapper::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Edge */
        }

        .social-btn {
            display: flex; align-items: center;
            width: 100%; height: 42px;
            color: white;
            border-radius: 20px;
            padding: 0 10px; cursor: pointer;
            text-decoration: none; font-weight: bold;
            margin-bottom: 6px;
            background-image: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0));
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            transition: transform 0.15s, opacity 0.15s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .social-btn:last-child { margin-bottom: 0; }
        .social-btn:active { transform: scale(0.95); opacity: 0.85; box-shadow: 0 0 16px var(--glow); }

        .whatsapp-btn { background: #25D366; }
        .telegram-btn { background: #0088cc; }
        .new-btn { background: #ff4500; } 
        .chat-btn { background: #8e44ad; }
        .group-btn { background: #3498db; }
        .download-btn { background: linear-gradient(135deg, #5c7a99, #37485c); margin: auto 0 8px; }

        /* ---- Огоҳонии паёмҳои нави "Групаи махсус" (зангула + шумора) ---- */
        .group-notify {
            display: flex; align-items: center; gap: 4px;
            margin-left: auto; flex-shrink: 0; padding-left: 6px;
        }
        .group-notify-bell {
            font-size: 17px; line-height: 1;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.35));
        }
        .group-notify-count {
            background: #e74c3c; color: #fff; font-size: 11px; font-weight: bold;
            min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
        }
        @keyframes groupBellRing {
            0%, 100% { transform: rotate(0); }
            10% { transform: rotate(22deg); } 20% { transform: rotate(-20deg); }
            30% { transform: rotate(16deg); } 40% { transform: rotate(-14deg); }
            50% { transform: rotate(10deg); } 60% { transform: rotate(-8deg); }
            70% { transform: rotate(5deg); } 80% { transform: rotate(-3deg); }
        }
        .group-notify-bell.ring { animation: groupBellRing 1.8s ease-in-out infinite; transform-origin: top center; }

        /* ---- Равзанаи (модал) тасдиқи скачат кардан ---- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            display: flex; align-items: center; justify-content: center;
            z-index: 500;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px; box-sizing: border-box;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-box {
            width: 100%; max-width: 300px;
            background: var(--surface);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid var(--surface-border);
            border-radius: 22px;
            box-shadow: var(--card-shadow);
            padding: 22px 18px;
            text-align: center;
            color: var(--text);
            transform: scale(0.85) translateY(10px);
            transition: transform 0.3s ease, background-color 0.4s, color 0.4s;
        }
        .modal-overlay.active .modal-box { transform: scale(1) translateY(0); }

        .modal-icon {
            width: 64px; height: 64px; margin: 0 auto 14px;
            background: white; border-radius: 50%;
            border: 1px solid #e0e0e0;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.2);
        }
        .modal-icon img { width: 100%; height: 100%; object-fit: cover; }

        .modal-text { margin: 0 0 18px; font-size: 15px; line-height: 1.4; font-weight: bold; }

        .modal-actions { display: flex; gap: 10px; justify-content: center; }

        .modal-btn {
            flex: 1; border: none; cursor: pointer;
            padding: 11px 0; border-radius: 18px;
            color: white; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            transition: transform 0.15s, opacity 0.15s, box-shadow 0.2s;
        }
        .modal-btn:active { transform: scale(0.92); opacity: 0.85; box-shadow: 0 0 16px var(--glow); }
        .modal-btn.yes-btn { background: linear-gradient(135deg, #25D366, #128C7E); }
        .modal-btn.no-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); }

        .icon-container {
            width: 35px; height: 35px;
            background: white; border-radius: 50%;
            border: 1px solid #e0e0e0;
            display: flex; align-items: center; justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
            overflow: hidden;
            padding: 0;
        }
        .icon-container img {
            width: 100%; height: 100%; 
            object-fit: cover;
        }
        
        .icon-max { width: 100% !important; height: 100% !important; }

        .inline-container {
            display: flex; justify-content: space-around; gap: 5px;
        }
        
        .icon-only-btn {
            width: 50px; height: 50px;
            border-radius: 50%;
            border: 1px solid var(--surface-border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            background: white;
            overflow: hidden;
            padding: 0;
            box-sizing: border-box;
        }
        .icon-only-btn img { 
            width: 100%; height: 100%; 
            object-fit: cover;
        }
        .icon-only-btn:active { transform: scale(0.9); box-shadow: 0 0 14px var(--glow); }

        .main-content-wrapper {
            position: relative; margin: 30px auto 65px auto;
            width: 80%; max-width: 600px;
            flex-shrink: 0;
        }

        .main-content { 
            position: relative;
            width: 100%; aspect-ratio: 16 / 9;
            background: white; box-shadow: 0 10px 30px var(--glow);
            border: 6px solid var(--accent);
            border-radius: 40px;
            overflow: hidden; 
            transition: border-color 0.4s, box-shadow 0.4s;
        }

        .overlay-panel {
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%;
            background: rgba(52, 73, 94, 0.9);
            color: white;
            display: flex; align-items: center; justify-content: center;
            transition: 0.5s ease;
            z-index: 5;
            border-radius: 34px;
        }
        .overlay-panel.active { right: 0; }

        #ytPlayer {
            position: absolute !important; top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            border: none !important;
        }

        .circle-button {
            position: absolute; left: 50%; bottom: 0;
            transform: translate(-50%, 50%);
            width: 70px; height: 70px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 50%;
            border: 5px solid #f9f9f9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3), 0 0 0 0 var(--glow);
            z-index: 10; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s, opacity 0.2s, background 0.4s; padding: 0;
            animation: pulse-glow 2.4s ease-in-out infinite;
        }
        .circle-button:active { transform: translate(-50%, 50%) scale(0.85); opacity: 0.8; }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 4px 10px rgba(0,0,0,0.3), 0 0 0 0 var(--glow); }
            50% { box-shadow: 0 4px 10px rgba(0,0,0,0.3), 0 0 0 10px transparent; }
        }
        @media (prefers-reduced-motion: reduce) {
            .circle-button { animation: none; }
        }
        
        #menuIcon { 
            width: 50%; height: 50%; filter: invert(1); 
            transition: transform 0.4s ease; 
        }

        .rotate { transform: rotate(180deg); }

        footer { 
            margin-top: auto; 
            background: linear-gradient(135deg, #10182b, #1c2740);
            color: var(--muted); text-align: center; 
            padding: 15px; font-size: 14px;
            border-top-left-radius: 25px; border-top-right-radius: 20px;
            border-top: 1px solid var(--surface-border);
            position: relative; z-index: 200;
            transition: background 0.4s, color 0.4s;
        }

        .menu-title { color: var(--text); transition: color 0.4s; }
        .frame-title { margin-bottom: 5px; font-size: 13px; color: var(--muted); text-align: center; transition: color 0.4s; }

        body.dark-mode .icon-container { background: #f1f1f1; }
        body.dark-mode .icon-only-btn { background: #f1f1f1; }
    </style>
</head>

    <script>
        /* ---- Ислоҳи мушкили bfcache: агар ин саҳифа аз bfcache барқарор шавад
           (масалан баъд аз "back"-и браузер аз grupa.html), онро тоза мекунем,
           то ҳамаи скриптҳо (меню, YouTube плеер) аз нав дуруст кор кунанд. ---- */
        window.addEventListener('pageshow', function (event) {
            if (event.persisted) {
                location.reload();
            }
        });

        /* ---- Синтезатори садоҳо (бе файли берунӣ, Web Audio API) ---- */
        let audioCtx;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playTone(freqFrom, freqTo, duration, type, gainVal) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freqFrom, ctx.currentTime);
                if (freqTo) osc.frequency.exponentialRampToValueAtTime(freqTo, ctx.currentTime + duration);
                gain.gain.setValueAtTime(gainVal || 0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain).connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) { /* audio not available - silently ignore */ }
        }
        function playClickSound() { playTone(880, 640, 0.08, 'triangle', 0.05); }
        function playOpenSound()  { playTone(280, 950, 0.22, 'sine', 0.045); }
        function playCloseSound() { playTone(750, 240, 0.20, 'sine', 0.045); }

        // Садои клик барои ҳамаи тугмаҳо (ба ҷуз тугмаи меню, ки худаш open/close дорад)
        document.addEventListener('click', function(e) {
            const el = e.target.closest('.social-btn, .icon-only-btn, .btn-round:not(.menu-toggle-btn), .modal-btn');
            if (el) playClickSound();
        });

        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const opening = !menu.classList.contains('active');
            menu.classList.toggle('active');
            opening ? playOpenSound() : playCloseSound();
        }

        function setMenuInsets() {
            const header = document.querySelector('header');
            const footer = document.querySelector('footer');
            document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
            document.documentElement.style.setProperty('--footer-h', footer.offsetHeight + 'px');
        }
        setMenuInsets();
        if (window.ResizeObserver) {
            const roInsets = new ResizeObserver(setMenuInsets);
            roInsets.observe(document.querySelector('header'));
            roInsets.observe(document.querySelector('footer'));
        } else {
            window.addEventListener('orientationchange', setMenuInsets);
        }

        /* ---- YouTube player: play/pause va sifati baland ---- */
        function forceHighQuality() {
            if (!ytPlayer || !ytPlayer.setPlaybackQuality) return;
            try {
                const levels = ytPlayer.getAvailableQualityLevels ? ytPlayer.getAvailableQualityLevels() : [];
                const best = levels && levels.length ? levels[0] : 'hd1080';
                ytPlayer.setPlaybackQuality(best);
            } catch (e) { /* ignore */ }
        }

        function toggleMainIcon() {
            const icon = document.getElementById('menuIcon');
            const panel = document.getElementById('overlayPanel');
            const icon1 = 'https://cdn-icons-png.flaticon.com/128/4211/4211344.png';
            const icon2 = 'https://cdn-icons-png.flaticon.com/128/714/714456.png';
            const opening = !panel.classList.contains('active');

            icon.src = icon.src.includes('4211344') ? icon2 : icon1;
            icon.classList.toggle('rotate');
            panel.classList.toggle('active');
            opening ? playOpenSound() : playCloseSound();

            if (!ytReady || !ytPlayer) {
                return;
            }
            if (opening) {
                ytPlayer.playVideo();
                forceHighQuality();
            } else {
                ytPlayer.pauseVideo();
                ytPlayer.seekTo(0, true);
            }
        }

        let ytPlaying = false;
        let ytPlayer = null;
        let ytReady = false;

        const ytScriptTag = document.createElement('script');
        ytScriptTag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(ytScriptTag);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('ytPlayer', {
                videoId: 'BT7FoLtE7L8',
                playerVars: { controls: 0, rel: 0, playsinline: 1, autoplay: 0 },
                events: {
                    'onReady': function() {
                        ytReady = true;
                        const panel = document.getElementById('overlayPanel');
                        if (panel && panel.classList.contains('active')) {
                            ytPlayer.playVideo();
                            forceHighQuality();
                        }
                    },
                    'onStateChange': function(event) {
                        if (event.data === YT.PlayerState.PLAYING) {
                            ytPlaying = true;
                            forceHighQuality();
                        } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                            ytPlaying = false;
                        }
                    }
                }
            });
        }

        document.body.addEventListener('click', function(e) {
            const menu = document.getElementById('sideMenu');
            const menuBtn = document.querySelector('.btn-round');
            
            if (menu.contains(e.target) || menuBtn.contains(e.target)) {
                return;
            }
            
            menu.classList.remove('active');
        });

        /* ---- Равзанаи тасдиқи скачат кардан ---- */
        function openDownloadModal(e) {
            if (e) e.preventDefault();
            document.getElementById('downloadModal').classList.add('active');
            playOpenSound();
        }
        function closeDownloadModal() {
            document.getElementById('downloadModal').classList.remove('active');
            playCloseSound();
        }
        function confirmDownload() {
            closeDownloadModal();
            // TODO: URL-и скачат кардани барнома дар оянда дар ин ҷо гузошта мешавад
            // window.location.href = 'ИНҶО_ССЫЛКАИ_АПК';
        }

        // Пахши берун аз равзана онро мепӯшонад
        document.getElementById('downloadModal').addEventListener('click', function(e) {
            if (e.target === this) closeDownloadModal();
        });

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            body.classList.toggle('dark-mode');
            icon.innerHTML = body.classList.contains('dark-mode') ? '☀️' : '🌙';
        }
    </script>

    <!-- ---- Огоҳонии паёмҳои нави гурӯҳи "Групаи махсус" ---- -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-database-compat.min.js"></script>
    <script>
    (function () {
        // Ҳамон конфиги Firebase, ки дар grupa.html истифода мешавад
        const firebaseConfig = {
            apiKey: "AIzaSyDskehF5n_IJuuUsGWQEFBmjM80uCSDEyM",
            authDomain: "live-chat-ea070.firebaseapp.com",
            databaseURL: "https://live-chat-ea070-default-rtdb.firebaseio.com",
            projectId: "live-chat-ea070",
            storageBucket: "live-chat-ea070.firebasestorage.app"
        };

        const notifyWrap = document.getElementById('group-notify');
        const bellEl = document.getElementById('group-notify-bell');
        const countEl = document.getElementById('group-notify-count');
        if (!notifyWrap || !bellEl || !countEl) return;

        // Профили корбар (ҳамон "lc_profile", ки grupa.html месозад).
        // Агар корбар ҳанӯз ягон бор ба гурӯҳ надаромада бошад — чизе намоиш дода намешавад.
        let ME = null;
        try {
            const raw = localStorage.getItem('lc_profile');
            if (raw) ME = JSON.parse(raw);
        } catch (e) { ME = null; }
        if (!ME || !ME.uid) return;

        try {
            firebase.initializeApp(firebaseConfig);
        } catch (e) { return; }
        const groupsRef = firebase.database().ref('groups');

        let prevUnread = -1; // -1 = ҳанӯз санҷида нашудааст (боркунии аввал)

        groupsRef.on('value', function (snap) {
            const groups = snap.val() || {};
            let totalUnread = 0;

            Object.values(groups).forEach(function (g) {
                if (!g || g.blocked) return;
                if (!g.subscribers || !g.subscribers[ME.uid]) return; // танҳо гурӯҳҳое, ки корбар обуна шудааст
                const lastSeenTs = (g.lastSeen && g.lastSeen[ME.uid]) || 0;
                const msgs = g.messages || {};
                Object.values(msgs).forEach(function (m) {
                    if (m && (m.ts || 0) > lastSeenTs) totalUnread++;
                });
            });

            if (totalUnread > 0) {
                notifyWrap.style.display = 'flex';
                countEl.textContent = totalUnread > 99 ? '99+' : String(totalUnread);
                bellEl.classList.add('ring');
            } else {
                notifyWrap.style.display = 'none';
                bellEl.classList.remove('ring');
            }

            // Садо мезанем ҳар вақте ки шумораи паёмҳои нахонда зиёд мешавад
            // (аз ҷумла дафъаи аввали воридшавӣ ба сомона, агар паёми нахонда бошад)
            if (totalUnread > 0 && totalUnread !== prevUnread) {
                playGroupBellSound();
            }
            prevUnread = totalUnread;
        });

        /* ---- Садои зангула (Web Audio API, бе файли берунӣ) ---- */
        let notifyAudioCtx = null;
        let pendingBellPlay = false;

        function emitBellTone(ctx) {
            const now = ctx.currentTime;
            const duration = 1.6;
            [
                { f: 880, g: 0.28 },
                { f: 1320, g: 0.16 },
                { f: 1760, g: 0.09 }
            ].forEach(function (p) {
                const o = ctx.createOscillator();
                const gainNode = ctx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(p.f, now);
                gainNode.gain.setValueAtTime(0.0001, now);
                gainNode.gain.exponentialRampToValueAtTime(p.g, now + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                o.connect(gainNode);
                gainNode.connect(ctx.destination);
                o.start(now);
                o.stop(now + duration + 0.05);
            });
        }

        function playGroupBellSound() {
            try {
                if (!notifyAudioCtx) {
                    notifyAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (notifyAudioCtx.state === 'suspended') {
                    // Браузер садоро то ишораи корбар (клик) манъ мекунад — интизор мемонем
                    pendingBellPlay = true;
                    notifyAudioCtx.resume().then(function () {
                        if (pendingBellPlay) {
                            pendingBellPlay = false;
                            emitBellTone(notifyAudioCtx);
                        }
                    }).catch(function () {});
                    return;
                }
                emitBellTone(notifyAudioCtx);
            } catch (e) { /* садо дастрас нест - сарфи назар мекунем */ }
        }

        // Дафъаи аввали клики корбар дар саҳифа - агар садои интизоршуда бошад, месозем
        document.addEventListener('click', function () {
            if (notifyAudioCtx && notifyAudioCtx.state === 'suspended') {
                notifyAudioCtx.resume().then(function () {
                    if (pendingBellPlay) {
                        pendingBellPlay = false;
                        emitBellTone(notifyAudioCtx);
                    }
                }).catch(function () {});
            }
        });
    })();
    </script>
