<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Идоракунии бози</title>
<style>
  :root{
    --bg:#0a0f1e;
    --bg-2:#0f1730;
    --surface:#121b30;
    --border:rgba(255,255,255,0.08);
    --gold:#e8b84b;
    --gold-2:#f4d374;
    --gold-dark:#a9781f;
    --crimson:#c23b3b;
    --crimson-2:#e05656;
    --text:#f2ecd9;
    --text-muted:#9aa3bd;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 18% -10%, rgba(232,184,75,0.10), transparent 42%),
      radial-gradient(circle at 85% 110%, rgba(194,59,59,0.12), transparent 45%),
      linear-gradient(180deg, var(--bg), var(--bg-2));
    color:var(--text);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 60px;
  }
  .eyebrow{
    color:var(--text-muted);
    font-size:0.82rem;
    letter-spacing:0.02em;
    margin:0 0 6px;
  }
  h1{
    font-size:1.5rem;
    margin:0 0 40px;
    font-weight:700;
    color:var(--gold-2);
    text-align:center;
  }
  .launch-row{
    display:flex;
    gap:22px;
    width:100%;
    max-width:820px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .launch-btn{
    --accent:var(--gold);
    --accent-2:var(--gold-2);
    flex:1 1 320px;
    min-width:260px;
    max-width:380px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:14px;
    padding:30px 26px;
    border-radius:18px;
    border:1px solid var(--border);
    background:linear-gradient(160deg, var(--surface), var(--bg-2));
    cursor:pointer;
    text-decoration:none;
    color:var(--text);
    overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .launch-btn::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(160deg, var(--accent) 0%, transparent 55%);
    opacity:0.08;
    pointer-events:none;
  }
  .launch-btn:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow:0 16px 34px -14px rgba(0,0,0,0.55), 0 0 0 1px var(--accent) inset;
  }
  .launch-btn:active{ transform:translateY(-1px); }
  .launch-icon{
    width:52px; height:52px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--accent-2), var(--accent));
    color:#1b1206;
    flex-shrink:0;
  }
  .launch-icon svg{ width:26px; height:26px; }
  .launch-label{
    font-size:1.15rem;
    font-weight:700;
    color:var(--text);
  }
  .launch-desc{
    font-size:0.85rem;
    color:var(--text-muted);
    line-height:1.5;
  }
  .launch-go{
    margin-top:4px;
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.82rem; font-weight:600;
    color:var(--accent-2);
  }
  .launch-go svg{ width:14px; height:14px; transition:transform .18s ease; }
  .launch-btn:hover .launch-go svg{ transform:translateX(3px); }

  .btn-final{ --accent:var(--crimson); --accent-2:var(--crimson-2); }
  .btn-admin{ --accent:var(--gold); --accent-2:var(--gold-2); }

  @media (max-width:480px){
    h1{ font-size:1.25rem; }
    .launch-btn{ padding:24px 20px; }
  }
</style>
</head>
<body>

  <p class="eyebrow">Идоракунии бози</p>
  <h1>Кадом равзанаро кушоем?</h1>

  <div class="launch-row">
    <a class="launch-btn btn-final" href="https://kholidtj1995.github.io/sayt-1/finali-bozi.html" target="_blank" rel="noopener">
      <div class="launch-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 4H4v2a3 3 0 0 0 3 3M17 4h3v2a3 3 0 0 1-3 3"/></svg>
      </div>
      <div>
        <div class="launch-label">Финали бози</div>
        <div class="launch-desc">Кушодани саҳифаи финали бозӣ дар равзанаи нав.</div>
      </div>
      <span class="launch-go">Кушодан
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>

    <a class="launch-btn btn-admin" href="https://kholidtj1995.github.io/sayt-1/qura-admin.html" target="_blank" rel="noopener">
      <div class="launch-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
      <div>
        <div class="launch-label">Қура админ</div>
        <div class="launch-desc">Кушодани панели идоракунии қура дар равзанаи нав.</div>
      </div>
      <span class="launch-go">Кушодан
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </a>
  </div>

</body>
</html>
