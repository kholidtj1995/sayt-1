<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEHRUZ TV</title>
<style>
  :root{
    --bg:#05070f;
    --bg-2:#0b1024;
    --surface:#121b30;
    --border:rgba(255,255,255,0.08);
    --gold:#e8b84b;
    --gold-2:#f4d374;
    --gold-dark:#a9781f;
    --crimson:#c23b3b;
    --crimson-2:#e05656;
    --text:#f2ecd9;
    --text-muted:#9aa3bd;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--bg), var(--bg-2));
    color:var(--text);
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 20px 60px;
    overflow-x:hidden;
    position:relative;
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
  }

  /* ---------- Live animated background ---------- */
  #bg-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }
  .glow-orb{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    pointer-events:none;
    z-index:0;
    opacity:0.55;
    animation:float-orb 14s ease-in-out infinite;
  }
  .orb-1{
    width:420px; height:420px;
    background:radial-gradient(circle, rgba(232,184,75,0.45), transparent 70%);
    top:-120px; left:-100px;
    animation-duration:16s;
  }
  .orb-2{
    width:380px; height:380px;
    background:radial-gradient(circle, rgba(194,59,59,0.4), transparent 70%);
    bottom:-140px; right:-100px;
    animation-duration:19s;
    animation-delay:-4s;
  }
  .orb-3{
    width:300px; height:300px;
    background:radial-gradient(circle, rgba(120,140,255,0.28), transparent 70%);
    top:40%; left:60%;
    animation-duration:22s;
    animation-delay:-9s;
  }
  @keyframes float-orb{
    0%,100%{ transform:translate(0,0) scale(1); }
    33%{ transform:translate(40px,-30px) scale(1.08); }
    66%{ transform:translate(-30px,25px) scale(0.95); }
  }

  #cursor-glow{
    position:fixed;
    width:260px; height:260px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(244,211,116,0.10), transparent 70%);
    pointer-events:none;
    z-index:1;
    transform:translate(-50%,-50%);
    transition:opacity .3s ease;
    opacity:0;
  }

  .content{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; width:100%; }

  .title-row{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin:0 0 44px;
  }
  .eyebrow{
    background:linear-gradient(90deg, var(--gold-dark), var(--gold-2), var(--crimson-2), var(--gold-2), var(--gold-dark));
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-size:1.9rem;
    font-weight:900;
    letter-spacing:0.2em;
    margin:0;
    text-transform:uppercase;
    text-shadow:0 0 24px rgba(244,211,116,0.35);
    animation:fade-down .7s ease both, shimmer-text 4s linear infinite;
  }
  @keyframes shimmer-text{
    to{ background-position:300% center; }
  }
  h1{
    font-size:1.9rem;
    margin:0;
    font-weight:800;
    color:var(--gold-2);
    text-align:center;
    letter-spacing:0.02em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-shadow:0 0 18px rgba(244,211,116,0.35), 0 0 40px rgba(244,211,116,0.12);
    animation:fade-down .7s ease .1s both;
  }
  h1 svg{
    width:1.3em; height:1.3em;
    animation:spin-slow 8s linear infinite;
    filter:drop-shadow(0 0 6px rgba(244,211,116,0.6));
  }
  @keyframes spin-slow{ to{ transform:rotate(360deg); } }
  @keyframes fade-down{
    from{ opacity:0; transform:translateY(-14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .launch-row{
    display:flex;
    gap:22px;
    width:100%;
    max-width:820px;
    flex-wrap:wrap;
    justify-content:center;
    perspective:1200px;
  }
  .launch-btn{
    --accent:var(--gold);
    --accent-2:var(--gold-2);
    --mx:50%;
    --my:50%;
    flex:1 1 320px;
    min-width:260px;
    max-width:380px;
    min-height:150px;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
    padding:36px 26px;
    border-radius:18px;
    border:1px solid var(--border);
    background:linear-gradient(160deg, var(--surface), var(--bg-2));
    cursor:pointer;
    text-decoration:none;
    color:var(--text);
    overflow:hidden;
    transform-style:preserve-3d;
    transition:transform .12s ease-out, box-shadow .25s ease, border-color .25s ease;
    animation:pop-in .6s cubic-bezier(.2,.9,.3,1.3) both;
    will-change:transform;
  }
  .launch-btn:nth-child(1){ animation-delay:.15s; }
  .launch-btn:nth-child(2){ animation-delay:.28s; }
  @keyframes pop-in{
    from{ opacity:0; transform:translateY(30px) scale(.92); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* cursor-tracking sheen */
  .launch-btn::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle 180px at var(--mx) var(--my), rgba(255,255,255,0.16), transparent 60%);
    opacity:0;
    transition:opacity .25s ease;
    pointer-events:none;
    z-index:1;
  }
  .launch-btn:hover::before{ opacity:1; }

  /* animated border glow */
  .launch-btn::after{
    content:"";
    position:absolute; inset:0;
    border-radius:18px;
    padding:1px;
    background:conic-gradient(from 0deg, var(--accent), transparent 30%, transparent 70%, var(--accent-2));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0;
    transition:opacity .3s ease;
    animation:spin-border 3s linear infinite;
    pointer-events:none;
  }
  .launch-btn:hover::after{ opacity:0.9; }
  @keyframes spin-border{ to{ transform:rotate(360deg); } }

  .launch-btn:hover{
    box-shadow:0 20px 45px -14px rgba(0,0,0,0.6), 0 0 30px -6px var(--accent);
    border-color:var(--accent);
  }
  .launch-btn:active{ transform:scale(.97) !important; }

  .launch-icon{
    width:52px; height:52px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--accent-2), var(--accent));
    color:#1b1206;
    flex-shrink:0;
    position:relative;
    z-index:2;
    box-shadow:0 0 0 0 var(--accent);
    transition:box-shadow .3s ease, transform .3s ease;
  }
  .launch-btn:hover .launch-icon{
    transform:rotate(-6deg) scale(1.08);
    box-shadow:0 0 24px 2px var(--accent);
  }
  .launch-icon svg{ width:26px; height:26px; }

  .launch-label{
    font-size:1.7rem;
    font-weight:800;
    color:var(--text);
    position:relative; z-index:2;
    letter-spacing:0.01em;
    text-shadow:0 0 16px rgba(244,211,116,0.25);
  }

  .btn-final{ --accent:var(--crimson); --accent-2:var(--crimson-2); }
  .btn-admin{ --accent:var(--gold); --accent-2:var(--gold-2); }

  /* click ripple */
  .ripple{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.55), rgba(255,255,255,0) 70%);
    transform:translate(-50%,-50%) scale(0);
    pointer-events:none;
    z-index:3;
    animation:ripple-anim .7s ease-out forwards;
  }
  @keyframes ripple-anim{
    to{ transform:translate(-50%,-50%) scale(1); opacity:0; }
  }

  /* click flash */
  .flash{
    position:absolute; inset:0;
    background:#fff;
    opacity:0;
    z-index:4;
    pointer-events:none;
    border-radius:18px;
    animation:flash-anim .35s ease-out forwards;
  }
  @keyframes flash-anim{
    0%{ opacity:.55; }
    100%{ opacity:0; }
  }

  @media (max-width:480px){
    h1{ font-size:1.3rem; }
    .eyebrow{ font-size:1.3rem; }
    .launch-btn{ padding:24px 20px; }
  }
</style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="glow-orb orb-3"></div>
  <div id="cursor-glow"></div>

  <div class="content">
    <div class="title-row">
      <span class="eyebrow">BEHRUZ TV</span>
      <h1>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        АДМИН ПАНЕЛ
      </h1>
    </div>

    <div class="launch-row">
      <a class="launch-btn btn-final" href="https://kholidtj1995.github.io/sayt-1/finali-bozi.html" target="_blank" rel="noopener">
        <div class="launch-label">Финали бози</div>
      </a>

      <a class="launch-btn btn-admin" href="https://kholidtj1995.github.io/sayt-1/qura-admin.html" target="_blank" rel="noopener">
        <div class="launch-label">Қура админ</div>
      </a>
    </div>
  </div>

  <script>
    /* ---------- Animated particle background ---------- */
    (function(){
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles;

      function resize(){
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const COUNT = Math.min(70, Math.floor((window.innerWidth * window.innerHeight) / 18000));
      particles = Array.from({length: COUNT}, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.6 + 0.4,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        hue: Math.random() > 0.5 ? '232,184,75' : '194,59,59',
        tw: Math.random() * Math.PI * 2
      }));

      function tick(){
        ctx.clearRect(0, 0, w, h);
        for(const p of particles){
          p.x += p.vx; p.y += p.vy;
          p.tw += 0.02;
          if(p.x < 0) p.x = w; if(p.x > w) p.x = 0;
          if(p.y < 0) p.y = h; if(p.y > h) p.y = 0;
          const alpha = 0.25 + Math.sin(p.tw) * 0.2;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.hue},${Math.max(alpha,0.05)})`;
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      tick();
    })();

    /* ---------- Cursor glow follow ---------- */
    const cursorGlow = document.getElementById('cursor-glow');
    window.addEventListener('mousemove', function(e){
      cursorGlow.style.opacity = '1';
      cursorGlow.style.left = e.clientX + 'px';
      cursorGlow.style.top = e.clientY + 'px';
    });
    window.addEventListener('mouseleave', function(){ cursorGlow.style.opacity = '0'; });

    /* ---------- Card tilt + sheen following mouse ---------- */
    document.querySelectorAll('.launch-btn').forEach(function(btn){
      btn.addEventListener('mousemove', function(e){
        const rect = btn.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const rotY = ((x - cx) / cx) * 8;
        const rotX = -((y - cy) / cy) * 8;
        btn.style.transform = `perspective(900px) rotateX(${rotX}deg) rotateY(${rotY}deg) translateY(-6px) scale(1.02)`;
        btn.style.setProperty('--mx', x + 'px');
        btn.style.setProperty('--my', y + 'px');
      });
      btn.addEventListener('mouseleave', function(){
        btn.style.transform = '';
      });
    });

  </script>

</body>
</html>
