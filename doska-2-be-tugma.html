<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доскаи 2 — Бе Тугма (Намоиши Бозӣ)</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
      background: #141414;
      font-family: Arial, sans-serif;
    }

    .ramka {
      padding: 12px;
      background: #fff;
      border: 8px solid #8b5a2b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      width: fit-content;
      max-width: 94vw;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sarlavha {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 8px 14px;
      background: linear-gradient(135deg, #3b2412 0%, #5a3a1d 50%, #3b2412 100%);
      border: 2px solid #d9a441;
      border-radius: 12px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.5), 0 3px 8px rgba(0,0,0,0.3);
    }
    .sarlavha-rost {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 20px;
      background: linear-gradient(180deg, rgba(255,233,168,0.2), rgba(217,164,65,0.1));
      border: 1px solid rgba(255, 233, 168, 0.5);
      border-radius: 999px;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #ffe9a8;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6), 0 0 10px rgba(255, 215, 120, 0.45);
      white-space: nowrap;
    }
    .sarlavha-rost .karnay {
      display: inline-block;
      font-size: 28px;
      animation: karnayLarz 2.4s ease-in-out infinite;
      transform-origin: 70% 70%;
    }
    @keyframes karnayLarz {
      0%, 70%, 100% { transform: rotate(0); }
      78% { transform: rotate(-14deg); }
      86% { transform: rotate(10deg); }
      94% { transform: rotate(-6deg); }
    }
    @media (max-width: 520px) {
      .sarlavha-rost { font-size: 18px; padding: 6px 12px; }
      .sarlavha-rost .karnay { font-size: 24px; }
    }

    .doska {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    .doska img {
      display: block;
      width: auto;
      height: auto;
      max-width: 82vw;
      max-height: 74vh;
      object-fit: contain;
    }

    .bur {
      position: absolute;
      left: 25%;
      right: 25%;
      top: 20%;
      bottom: 22%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
      padding: 4px 6px;
      text-align: center;
      line-height: 1.15;
      color: #f5f5f0;
      font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive;
      font-size: clamp(14px, 1.9vw, 24px);
      word-break: break-word;
      overflow-wrap: anywhere;
      overflow: hidden;
      pointer-events: none;
      text-shadow: 0 0 2px rgba(255,255,255,0.8), 1px 1px 3px rgba(0,0,0,0.6);
      opacity: 0.96;
      transform: rotate(-1deg);
    }

    .bolo-qism {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .nom {
      font-size: 0.72em;
      line-height: 1.1;
      color: #f5f5f0;
    }
    .taymer-qutti {
      display: inline-block;
      padding: 1px 10px;
      border: 2px dashed rgba(245, 245, 240, 0.75);
      border-radius: 10px;
      font-size: 0.78em;
      line-height: 1.15;
      font-weight: bold;
      color: #f5f5f0;
      transition: all 0.2s ease;
    }
    .taymer-qutti.khatar {
      color: #ff6b6b;
      border-color: #ff6b6b;
      animation: larzish 0.45s infinite;
    }
    .taymer-qutti.tamom {
      color: #90ee90;
      border-color: #90ee90;
    }
    @keyframes larzish {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.14); }
    }

    .savol {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-wrap;
      padding: 2px 0;
      font-size: 1em;
      line-height: 1.15;
    }

    .javob {
      flex: none;
      padding-top: 4px;
      border-top: 1px dashed rgba(245,245,240,0.45);
      white-space: pre-wrap;
      font-size: 0.88em;
      line-height: 1.15;
    }
    .javob-ochiq {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.85), 1px 1px 3px rgba(0,0,0,0.7);
      animation: paydoShudan 0.5s ease-out;
    }
    @keyframes paydoShudan {
      0% { transform: scale(0.7); opacity: 0; }
      70% { transform: scale(1.12); }
      100% { transform: scale(1); opacity: 1; }
    }

    .holi {
      position: absolute;
      left: 24%;
      right: 24%;
      top: 19%;
      bottom: 21%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      text-align: center;
      color: #f5f5f0;
      font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 2;
      transform: rotate(-1deg);
    }
    .holi.faol { opacity: 0.96; }

    .bur-matn-bolo-savol {
      font-size: clamp(16px, 2.3vw, 29px);
      line-height: 1.15;
      color: #f5f5f0;
      text-shadow: 0 0 3px rgba(255,255,255,0.85), 1px 2px 4px rgba(0,0,0,0.75);
      animation: holiNafas 2.6s ease-in-out infinite;
    }

    .holi-emoji {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      position: relative;
      font-size: clamp(34px, 6.2vh, 62px);
      line-height: 1;
      padding-top: 0.5em;
    }
    .holi-emoji .odam1 { animation: odamBala 1.8s ease-in-out infinite; }
    .holi-emoji .odam2 { animation: odamBala 1.8s ease-in-out infinite 0.9s; }
    .holi-emoji .savolnishon {
      position: absolute;
      top: -0.05em;
      left: 50%;
      font-size: 0.82em;
      color: #f5f5f0;
      text-shadow: 0 0 4px rgba(255,255,255,0.9), 1px 1px 3px rgba(0,0,0,0.75);
      transform: translateX(-50%);
      animation: savolParvoz 2.4s ease-in-out infinite;
    }
    @keyframes odamBala {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-0.22em) rotate(3deg); }
    }
    @keyframes savolParvoz {
      0%, 100% { transform: translate(-50%, 0) scale(1); opacity: 0.9; }
      50% { transform: translate(-50%, -0.22em) scale(1.18); opacity: 1; }
    }

    .holi-matn {
      font-size: clamp(17px, 2.5vw, 31px);
      line-height: 1.15;
      color: #f5f5f0;
      text-shadow: 0 0 3px rgba(255,255,255,0.85), 1px 2px 4px rgba(0,0,0,0.7);
      animation: holiNafas 2.6s ease-in-out infinite;
    }
    @keyframes holiNafas {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    .bur.pok-shuda {
      -webkit-mask-image: linear-gradient(to right, transparent 0%, transparent 42%, #000 58%, #000 100%);
      mask-image: linear-gradient(to right, transparent 0%, transparent 42%, #000 58%, #000 100%);
      -webkit-mask-size: 200% 100%;
      mask-size: 200% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      animation: pokMask 1.4s ease-in-out forwards;
    }
    @keyframes pokMask {
      from { -webkit-mask-position: 100% 0; mask-position: 100% 0; }
      to   { -webkit-mask-position: 0 0;    mask-position: 0 0; }
    }
    .gubka {
      display: none;
      position: absolute;
      top: 30%;
      left: 22%;
      width: 14%;
      height: 12%;
      min-width: 50px;
      min-height: 28px;
      background: linear-gradient(#e9d8a6 0 35%, #5b3a1a 35% 100%);
      border-radius: 6px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 3;
    }
    .gubka.faol {
      display: block;
      animation: gubkaRaft 1.4s ease-in-out forwards;
    }
    @keyframes gubkaRaft {
      0%   { left: 22%; top: 28%; transform: rotate(-8deg); }
      12%  { top: 38%; }
      25%  { top: 30%; }
      37%  { top: 44%; }
      50%  { top: 32%; }
      62%  { top: 48%; }
      75%  { top: 36%; }
      100% { left: 68%; top: 44%; transform: rotate(6deg); }
    }
  </style>
</head>
<body>
  <div class="ramka">
    <div class="sarlavha">
      <div class="sarlavha-rost"><span class="karnay">📢</span><span>Савол ва Ҷавоб</span></div>
    </div>
    <div class="doska">
      <img src="https://kholidtj1995.github.io/sayt-1/РАСМ.jpg" alt="Доскаи бозӣ">
      <div class="holi" id="holi">
        <div class="bur-matn-bolo-savol">Саволи шумо ба доска мебарояд!</div>
        <div class="holi-emoji">
          <span class="odam1">🙋‍♂️</span>
          <span class="savolnishon">❓</span>
          <span class="odam2">🙋‍♀️</span>
        </div>
        <div class="holi-matn">Марҳамат, дустон!</div>
      </div>
      <div class="gubka" id="gubka"></div>
      <div class="bur" id="bur">
        <div class="bolo-qism">
          <div class="nom" id="nom"></div>
          <div class="taymer-qutti" id="taymerQutti" style="display:none;">⏳ 00:00</div>
        </div>
        <div class="savol" id="savol"></div>
        <div class="javob" id="javob">
          <span>Ҷавоб: </span><span id="javobMatn">❓ Пинҳон аст</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const savol = document.getElementById('savol');
    const nom = document.getElementById('nom');
    const javob = document.getElementById('javob');
    const javobMatn = document.getElementById('javobMatn');
    const taymerQutti = document.getElementById('taymerQutti');
    const bur = document.getElementById('bur');
    const gubka = document.getElementById('gubka');
    const holi = document.getElementById('holi');

    let dataSavol = '';
    let dataNom = '';
    let dataJavob = '';
    let javobOchiq = false;
    let boqiVaqt = 0;
    let vaqtiAnjom = 0;
    let pauzaShuda = false;
    let tikInterval = null;

    const kanal = ('BroadcastChannel' in window) ? new BroadcastChannel('doska-judo-kanal') : null;

    function formatVaqt(soniya) {
      const m = String(Math.floor(soniya / 60)).padStart(2, '0');
      const s = String(soniya % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function navishtiTaymer() {
      if (boqiVaqt > 0 && !javobOchiq) {
        taymerQutti.style.display = 'inline-block';
        taymerQutti.textContent = (pauzaShuda ? '⏸ ' : '⏳ ') + formatVaqt(boqiVaqt);
        taymerQutti.classList.remove('tamom');
        if (boqiVaqt <= 10) {
          taymerQutti.classList.add('khatar');
        } else {
          taymerQutti.classList.remove('khatar');
        }
      } else if (javobOchiq && dataJavob.trim()) {
        taymerQutti.style.display = 'inline-block';
        taymerQutti.textContent = '⏰ Вақт тамом шуд!';
        taymerQutti.classList.remove('khatar');
        taymerQutti.classList.add('tamom');
      } else {
        taymerQutti.style.display = 'none';
      }
    }

    function namoish() {
      savol.textContent = dataSavol;
      const javobHast = !!dataJavob.trim();
      javob.style.display = javobHast ? '' : 'none';

      if (javobOchiq && javobHast) {
        javobMatn.textContent = dataJavob.trim();
        javobMatn.className = 'javob-ochiq';
      } else {
        javobMatn.textContent = '❓ Пинҳон аст';
        javobMatn.className = '';
      }

      nom.textContent = dataNom.trim() ? `(Саволдиҳанда: ${dataNom.trim()})` : '';
      const holiBosh = !dataSavol.trim() && !dataNom.trim() && !dataJavob.trim();
      holi.classList.toggle('faol', holiBosh);
    }

    function pakhshPokKardan() {
      gubka.classList.add('faol');
      bur.classList.add('pok-shuda');
      setTimeout(() => {
        bur.classList.remove('pok-shuda');
        gubka.classList.remove('faol');
      }, 1450);
    }

    function idoraTikTaymer() {
      clearInterval(tikInterval);
      tikInterval = setInterval(() => {
        if (javobOchiq || !dataJavob.trim()) {
          clearInterval(tikInterval);
          return;
        }
        if (!pauzaShuda && vaqtiAnjom > 0) {
          boqiVaqt = Math.max(0, Math.ceil((vaqtiAnjom - Date.now()) / 1000));
          if (boqiVaqt <= 0) {
            javobOchiq = true;
            namoish();
            navishtiTaymer();
            clearInterval(tikInterval);
            return;
          }
        }
        navishtiTaymer();
      }, 200);
    }

    function khondanAzStorage() {
      try {
        dataSavol = localStorage.getItem('doska-savol') || '';
        dataNom = localStorage.getItem('doska-nom') || '';
        dataJavob = localStorage.getItem('doska-javob') || '';
        javobOchiq = localStorage.getItem('doska-javob-ochiq') === '1';
        pauzaShuda = localStorage.getItem('doska-pauza') === '1';
        vaqtiAnjom = parseInt(localStorage.getItem('doska-vaqti-anjom') || '0', 10);
        const savedBoqi = parseInt(localStorage.getItem('doska-boqi-vaqt') || '0', 10);

        if (!javobOchiq && dataJavob.trim()) {
          if (pauzaShuda) {
            boqiVaqt = savedBoqi;
          } else if (vaqtiAnjom > Date.now()) {
            boqiVaqt = Math.max(0, Math.ceil((vaqtiAnjom - Date.now()) / 1000));
          } else {
            boqiVaqt = 0;
            javobOchiq = true;
          }
        } else {
          boqiVaqt = 0;
        }
      } catch (e) {}

      namoish();
      navishtiTaymer();
      idoraTikTaymer();
    }

    khondanAzStorage();

    if (kanal) {
      kanal.onmessage = function (event) {
        const p = event.data || {};
        if (p.pokShuda) {
          pakhshPokKardan();
        }
        dataSavol = p.dataSavol || '';
        dataNom = p.dataNom || '';
        dataJavob = p.dataJavob || '';
        javobOchiq = !!p.javobOchiq;
        boqiVaqt = p.boqiVaqt || 0;
        vaqtiAnjom = p.vaqtiAnjom || 0;
        pauzaShuda = !!p.pauzaShuda;
        namoish();
        navishtiTaymer();
        idoraTikTaymer();
      };
    }

    window.addEventListener('storage', function (e) {
      if (e.key === 'doska-pok-anim' && e.newValue) {
        pakhshPokKardan();
      }
      if (e.key && e.key.startsWith('doska-')) {
        khondanAzStorage();
      }
    });
  </script>
</body>
</html>
